services:
  api:
    build: ./
    container_name: instancia01
    ports:
      - 8081:8080
    environment:
      - POSTGRES_HOST=${DB_HOST}
      - ASPNETCORE_URLS=${API_URL}
    restart: always

  api2:
    build: ./
    container_name: instancia02
    ports:
      - 8082:8081
    environment:
      - POSTGRES_HOST=${DB_HOST}
      - ASPNETCORE_URLS=${API_URL2}
    restart: always

  db:
    image: postgres:18.1
    container_name: postgres-db
    restart: always
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:

